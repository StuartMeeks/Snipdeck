name: release

# Triggered by tags of the form vMAJOR.MINOR.PATCH (stable) or
# vMAJOR.MINOR.PATCH-suffix (pre-release; the hyphen marks it as a pre-release
# on GitHub and feeds Velopack's channel).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  # NuGet Trusted Publishing: the job exchanges a GitHub OIDC token for a
  # short-lived nuget.org API key (NuGet/login@v1), so no long-lived secret.
  id-token: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  PACK_ID: "Snipdeck"
  # Run JavaScript actions (e.g. actions/upload-artifact@v4) on Node.js 24 ahead of
  # GitHub forcing it on 2026-06-16, silencing the Node.js 20 deprecation warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PACK_AUTHORS: "Stuart Meeks"
  PACK_TITLE: "Snipdeck"

jobs:
  release:
    name: Build + publish Velopack release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj

      - name: Install Nerdbank.GitVersioning CLI
        # Pinned to the latest stable nbgv, kept in sync with the
        # Nerdbank.GitVersioning package so the CLI's version math matches the
        # assembly stamping. --allow-downgrade keeps this deterministic if the
        # hosted runner ever preinstalls a newer nbgv than we pin.
        run: dotnet tool install --global nbgv --version 3.10.85 --allow-downgrade

      - name: Derive version + channel from NBGV
        id: meta
        shell: pwsh
        run: |
          # NBGV is the single source of truth — version.json + git height.
          # On a tagged (public-release) build the SemVer2 string is clean
          # (no commit-id suffix), e.g. 0.1.0-alpha.7 or 0.1.0 for a stable cut.
          $json = nbgv get-version --format json | ConvertFrom-Json
          if (-not $json.PublicRelease) {
            Write-Error "NBGV did not treat ref '$($json.BuildingRef)' as a public release. The release tag must match publicReleaseRefSpec in version.json; create it with 'nbgv tag'."
            exit 1
          }
          $version = $json.SemVer2
          $prerelease = $json.PrereleaseVersionNoLeadingHyphen   # 'alpha.7' or ''
          # Emit lowercase 'true'/'false' explicitly — PowerShell's boolean
          # string-interpolation produces 'True'/'False' (capitalised), which
          # softprops/action-gh-release@v2 silently treats as falsy.
          if ($prerelease) {
            $isPrerelease = 'true'
            $channel = ($prerelease -split '\.')[0]   # 'alpha'
          } else {
            $isPrerelease = 'false'
            $channel = 'stable'
          }
          "version=$version"           >> $env:GITHUB_OUTPUT
          "isPrerelease=$isPrerelease" >> $env:GITHUB_OUTPUT
          "channel=$channel"           >> $env:GITHUB_OUTPUT
          Write-Host "Tag         : ${{ github.ref_name }}"
          Write-Host "Version     : $version"
          Write-Host "Pre-release : $isPrerelease"
          Write-Host "Channel     : $channel"

      - name: Restore
        run: dotnet restore

      - name: Run Core tests
        run: dotnet test tests/Snipdeck.Core.Tests/Snipdeck.Core.Tests.csproj --configuration Release --no-restore

      - name: Publish Snipdeck.App (win-x64)
        # No -p:Version here — Nerdbank.GitVersioning stamps the assemblies at
        # build time from version.json + git height (the same number the meta
        # step reads), so an explicit Version would be redundant and ignored.
        run: dotnet publish src/Snipdeck.App/Snipdeck.App.csproj --configuration Release --runtime win-x64 --self-contained true --output publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Pack with Velopack
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $channel = "${{ steps.meta.outputs.channel }}"
          vpk pack `
            --packId "${{ env.PACK_ID }}" `
            --packVersion $version `
            --packDir publish `
            --mainExe Snipdeck.App.exe `
            --packTitle "${{ env.PACK_TITLE }}" `
            --packAuthors "${{ env.PACK_AUTHORS }}" `
            --icon src/Snipdeck.App/Assets/Snipdeck.ico `
            --channel $channel `
            --outputDir Releases

      - name: Upload Velopack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snipdeck-${{ steps.meta.outputs.version }}
          path: Releases/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.meta.outputs.isPrerelease }}
          generate_release_notes: true
          files: |
            Releases/*

      # The SnipCommand importer ships independently of the desktop app as a
      # .NET global tool on NuGet.org. NBGV stamps the same version as the app
      # at build time, so no explicit -p:Version is needed here either.
      - name: Pack snipdeck-importer (.NET global tool)
        run: dotnet pack tools/Snipdeck.Importer/Snipdeck.Importer.csproj --configuration Release --no-restore --output nuget

      # Trusted Publishing: exchange the job's GitHub OIDC token for a temporary
      # nuget.org API key (valid ~1h). Run immediately before the push so the key
      # does not expire. Requires a trusted publishing policy on nuget.org for
      # this repo + workflow file (release.yml), and the NUGET_USER secret set to
      # the nuget.org profile username (not the account email).
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push snipdeck-importer to NuGet.org
        # Resolve the package explicitly — PowerShell does not glob-expand
        # arguments to native commands, and `dotnet nuget push` treats the
        # pattern literally, so "nuget/*.nupkg" fails with "File does not exist".
        shell: pwsh
        run: |
          $pkg = Get-ChildItem nuget -Filter *.nupkg | Select-Object -First 1
          if (-not $pkg) { Write-Error "No .nupkg found in nuget/"; exit 1 }
          dotnet nuget push $pkg.FullName --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
